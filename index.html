<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온라인 게시판</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-container">
      <section id="authPage" class="auth-page" aria-labelledby="authTitle">
        <p class="eyebrow">ONLINE NOTICE BOARD</p>
        <h1 id="authTitle">온라인 게시판</h1>
        <p class="page-description">로그인하거나 회원가입 후 게시판을 이용하세요.</p>
        <form id="authForm" class="auth-panel">
          <label for="emailInput">이메일</label>
          <input id="emailInput" type="email" autocomplete="email" required />
          <label for="passwordInput">비밀번호</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" required />
          <div class="auth-actions">
            <button type="submit" data-auth-action="signin">로그인</button>
            <button type="submit" data-auth-action="signup" class="secondary-button">회원가입</button>
          </div>
          <p id="authMessage" class="auth-message" aria-live="polite"></p>
        </form>
      </section>

      <section id="boardPage" hidden>
        <header class="board-header">
          <div>
            <p class="eyebrow">ONLINE NOTICE BOARD</p>
            <h1>게시판</h1>
          </div>
          <div class="member-actions">
            <span id="userEmail" class="user-email"></span>
            <button id="addNoticeButton" type="button">+ 등록</button>
            <button id="myInfoButton" type="button" class="secondary-button">내정보</button>
            <button id="signOutButton" type="button" class="secondary-button">로그아웃</button>
          </div>
        </header>

        <section id="listView">
          <p class="page-description">게시글 제목을 검색해 보세요.</p>
          <form id="searchForm" class="search-form">
            <label for="searchInput">게시글 제목 검색</label>
            <div class="search-row">
              <input id="searchInput" type="search" placeholder="제목을 입력하세요" autocomplete="off" />
              <button type="submit">검색</button>
            </div>
          </form>
          <p id="statusMessage" class="status-message" aria-live="polite"></p>
          <div id="noticeList" class="notice-table-wrap" aria-label="게시글 목록"></div>
        </section>

        <section id="profilePage" hidden>
          <div class="page-heading">
            <div><h2>내정보</h2><p>회원 정보와 내가 작성한 글을 확인합니다.</p></div>
            <button id="backToBoardButton" type="button" class="secondary-button">게시판으로</button>
          </div>
          <section class="member-info"><h3>회원 정보</h3><p id="profileEmail"></p><form id="nicknameForm" class="nickname-form"><label for="nicknameInput">닉네임</label><div><input id="nicknameInput" maxlength="40" required /><button id="saveNicknameButton" type="submit">닉네임 저장</button></div><p id="nicknameMessage" class="auth-message" aria-live="polite"></p></form></section>
          <section><h3>내가 작성한 글</h3><p id="myNoticeMessage" class="status-message" aria-live="polite"></p><div id="myNoticeList" class="notice-table-wrap"></div></section>
        </section>

        <section id="noticeDetailSection" class="notice-detail" hidden>
          <button id="backToListButton" type="button" class="secondary-button">목록으로</button>
          <article class="detail-card"><div class="detail-header"><div class="detail-title-meta"><p id="detailBadge" class="badge"></p><h2 id="detailTitle"></h2></div><div class="detail-author-meta"><p id="detailAuthor"></p><p id="detailCreatedAt"></p></div></div><div id="detailBody" class="detail-body"></div><img id="detailImage" class="detail-image" alt="게시글 이미지" hidden /></article>
          <section class="comments-section"><h2>댓글</h2><div id="commentList"></div><form id="commentForm" class="comment-form"><label for="commentInput">댓글 내용</label><div class="rich-toolbar" data-editor-toolbar="commentInput"><button type="button" data-command="bold"><strong>굵게</strong></button><button type="button" data-command="italic"><em>기울임</em></button><button type="button" data-command="underline"><u>밑줄</u></button><button type="button" data-command="insertUnorderedList">목록</button></div><div id="commentInput" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true"></div><button id="saveCommentButton" type="submit">저장</button><p id="commentMessage" class="auth-message" aria-live="polite"></p></form></section>
        </section>
      </section>

      <dialog id="noticeDialog" class="notice-dialog"><form id="noticeForm" method="dialog"><div class="dialog-heading"><h2>게시글 등록</h2><button id="closeDialogButton" type="button" class="secondary-button">닫기</button></div><label for="noticeTitleInput">제목</label><input id="noticeTitleInput" required /><label for="noticeBodyInput">내용</label><div class="rich-toolbar" data-editor-toolbar="noticeBodyInput"><button type="button" data-command="bold"><strong>굵게</strong></button><button type="button" data-command="italic"><em>기울임</em></button><button type="button" data-command="underline"><u>밑줄</u></button><button type="button" data-command="insertUnorderedList">목록</button><button type="button" data-command="insertOrderedList">번호 목록</button></div><div id="noticeBodyInput" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true"></div><label class="check-label"><input id="isNoticeInput" type="checkbox" /> 공지로 등록</label><label for="imageInput">이미지 (선택)</label><input id="imageInput" type="file" accept="image/*" /><button id="saveNoticeButton" type="submit">저장</button><p id="noticeFormMessage" class="auth-message" aria-live="polite"></p></form></dialog>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
